# GoReleaser config for the `inari` CLI.
#
# Invoked from .github/workflows/release.yml after a release-please Release PR
# is merged (NOT via tag-push triggers). The Go scaffold lands in M4; the
# ldflags below inject version info into `main.version`/`main.commit`/
# `main.date` — M4 should declare these vars in package main (or adjust here).
version: 2

project_name: inari

builds:
  - id: inari
    main: ./
    binary: inari
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_{{ .Arch }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# CHANGELOG.md is owned by release-please; goreleaser does not regenerate it.
changelog:
  disable: true

# brew/scoop tap publishing is temporarily disabled: the tap repos
# (7K-Inari/homebrew-tap, 7K-Inari/scoop-bucket) do not exist yet and the
# release token has no access (v0.4.0 run failed with 401/404), which aborted
# the whole goreleaser run before core artifacts were uploaded.
# Follow-up: create the tap repos, add a HOMEBREW_TAP_GITHUB_TOKEN secret with
# write access, and restore publishing using `brews:` (formula — appropriate
# for a CLI binary; `homebrew_casks:` is for GUI apps) plus `scoops:`.

# Follow-up: cosign-sign archives/checksums once signing infra exists
# (see AGENTS.md "Conventions").
