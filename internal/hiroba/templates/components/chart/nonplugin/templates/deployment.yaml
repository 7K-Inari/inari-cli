apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "__HIROBA_NAME__.fullname" . }}
  labels: {{ include "__HIROBA_NAME__.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: __HIROBA_NAME__
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{ include "__HIROBA_NAME__.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
{{ if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
{{ else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          volumeMounts:
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
            - {name: nginx-tmp, mountPath: /tmp}
      volumes:
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-run, emptyDir: {}}
        - {name: nginx-tmp, emptyDir: {}}
