apiVersion: v1
kind: Service
metadata:
  name: {{ include "__HIROBA_NAME__.fullname" . }}
  labels: {{ include "__HIROBA_NAME__.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: __HIROBA_NAME__
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
