apiVersion: apps/v1
kind: Deployment
metadata:
  name: __HIROBA_FIXTURE_NAME__
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: __HIROBA_FIXTURE_NAME__}
  template:
    metadata:
      labels: {app: __HIROBA_FIXTURE_NAME__}
    spec:
      containers:
        - name: fixture
          image: nginxinc/nginx-unprivileged@sha256:c38007e929d1d368ea26df1b696bfc5655e274db11f755fad63c25950a157423
          securityContext: {runAsNonRoot: true, runAsUser: 101}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
