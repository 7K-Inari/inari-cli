name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # PR-only mode: opens/updates the Release PR (version bump + CHANGELOG).
      # Tags and GitHub Releases are created by release.yml after the Release PR
      # is merged, so that goreleaser can publish artifacts in the same run.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
