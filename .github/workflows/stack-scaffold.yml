name: generated chartless KRO lifecycle
on:
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  kro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 7K-Hiroba/workflows
          ref: f092eab6bb07de64a2d6f2e35ac4c65fca794f76 # v2.0.3
          path: .hiroba/workflows
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: {go-version: "1.26.3", cache: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - run: pip install --requirement .hiroba/workflows/requirements-dev.txt
      - id: tools-key
        run: echo "key=$(.hiroba/workflows/scripts/install-ci-tools.sh --profiles kro --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/hiroba-cache
          key: generated-kro-${{ steps.tools-key.outputs.key }}
      - name: Install only chartless KRO lifecycle tools
        env:
          HIROBA_CACHE_DIR: ${{ runner.temp }}/hiroba-cache
          HIROBA_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: .hiroba/workflows/scripts/install-ci-tools.sh --profiles kro
      - name: Generate the exact chartless KRO consumer
        env:
          HOME: ${{ runner.temp }}/home
        run: go run . hiroba init qa-kro --dir "$RUNNER_TEMP" --type catalog --archetype stack --with-observability
      - name: Initialize generated source identity
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/qa-kro"
          git -C "$fixture" init -q
          git -C "$fixture" config user.name "Generated QA"
          git -C "$fixture" config user.email "generated-qa@example.invalid"
          git -C "$fixture" add --all
          git -C "$fixture" commit -qm "generated chartless KRO fixture"
      - name: Reconcile install and upgrade in one fresh cluster
        env:
          WORKFLOW_SHA: f092eab6bb07de64a2d6f2e35ac4c65fca794f76
          HIROBA_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: .hiroba/workflows/scripts/run-stack-lifecycle.sh --root "$RUNNER_TEMP/qa-kro"
      - name: Bind generator and generated fixture identities
        if: always()
        env:
          GENERATOR_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qa-kro/evidence/stack-lifecycle.json"
          [[ -s "$evidence" ]] || { echo "missing stack lifecycle evidence: $evidence" >&2; exit 1; }
          generatedSha=$(git -C "$RUNNER_TEMP/qa-kro" rev-parse HEAD)
          [[ "$generatedSha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid generated fixture SHA: $generatedSha" >&2; exit 1; }
          [[ "$GENERATOR_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid generator source SHA: $GENERATOR_SOURCE_SHA" >&2; exit 1; }
          originalSha=$(jq -er '.sourceSha | select(type == "string" and length > 0)' "$evidence") || { echo "missing evidence sourceSha" >&2; exit 1; }
          [[ "$originalSha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid original evidence sourceSha: $originalSha" >&2; exit 1; }
          [[ "$originalSha" == "$generatedSha" ]] || { echo "evidence sourceSha does not match generated fixture HEAD" >&2; exit 1; }
          temporary=$(mktemp "$evidence.binding.XXXXXX")
          trap 'rm -f "$temporary"' EXIT
          jq --arg sourceSha "$GENERATOR_SOURCE_SHA" --arg generatedSourceSha "$generatedSha" \
            '. + {sourceSha: $sourceSha, generatedSourceSha: $generatedSourceSha}' "$evidence" > "$temporary"
          chmod --reference="$evidence" "$temporary"
          mv "$temporary" "$evidence"
          trap - EXIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: generated-kro-lifecycle-evidence
          path: |
            ${{ runner.temp }}/qa-kro/evidence
            ${{ runner.temp }}/qa-kro/diagnostics
          if-no-files-found: ignore
          retention-days: 30
